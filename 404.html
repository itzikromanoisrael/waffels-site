<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>העמוד לא נמצא | Waffel’s Dog Grooming</title>
  <style>
    :root { --ink:#17191a; --muted:#62696d; --soft:#f6f7f5; --blue:#dff3fa; --blue-strong:#2e7189; --line:#dfe4e5; --radius:10px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); background: radial-gradient(circle at 70% 12%, #fff 0, var(--soft) 45%, #eaf4f7 100%); }
    main { width: min(620px, 100%); padding: 34px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.9); box-shadow: 0 20px 50px rgba(16,24,28,.12); }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 8vw, 54px); line-height: 1.05; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 18px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: var(--radius); text-decoration: none; font-weight: 800; }
    .primary { background: var(--ink); color: #fff; }
    .secondary { background: var(--blue); color: var(--ink); border: 1px solid var(--blue-strong); }
    :focus-visible { outline: 3px solid rgba(46,113,137,.5); outline-offset: 3px; }
    @media (max-width: 520px) { main { padding: 24px; } .actions a { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>אופס, העמוד לא נמצא</h1>
    <p>יכול להיות שהקישור השתנה. אפשר לחזור לדף הבית של Waffel’s או לשלוח WhatsApp לאורטל עם פרטי הכלב.</p>
    <div class="actions">
      <a class="primary" href="/">חזרה לדף הבית</a>
      <a class="secondary" href="https://wa.me/972528978102?text=%D7%A9%D7%9C%D7%95%D7%9D%2C%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%93%D7%A8%D7%9A%20%D7%94%D7%90%D7%AA%D7%A8%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A4%D7%A8%D7%98%D7%99%D7%9D%20%D7%A2%D7%9C%20%D7%98%D7%99%D7%A4%D7%95%D7%97%20%D7%9C%D7%9B%D7%9C%D7%91%20%F0%9F%90%BE">WhatsApp לאורטל</a>
    </div>
  </main>
</body>
</html>
